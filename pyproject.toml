[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvscope"
version = "0.1.0"
description = "Local-first CSV/TSV data explorer — profiles, filters and group-by charts in your browser, with zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "李帅" }]
keywords = ["csv", "tsv", "data-explorer", "data-profiling", "local-first", "privacy", "eda"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/li-shuai-i/lixiaoshuaidebaibaoxiang"
Source = "https://github.com/li-shuai-i/lixiaoshuaidebaibaoxiang"
Issues = "https://github.com/li-shuai-i/lixiaoshuaidebaibaoxiang/issues"

[project.scripts]
csvscope = "csvscope.cli:main"

[tool.setuptools]
packages = ["csvscope"]

[tool.setuptools.package-data]
csvscope = ["static/*"]
