name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # ubuntu-latest is 26.04, which no longer ships Python 3.9.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          # Keep 3.9 covered on the last Ubuntu image that still provides it.
          - os: ubuntu-22.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        run: |
          python -m csvscope --version
          python -c "from csvscope.core import Dataset; d = Dataset.from_text(open('examples/orders.csv', encoding='utf-8').read()); print(d.row_count, 'rows')"
